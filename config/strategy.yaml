# Strategy YAML config file for Top Picker Terminal.
#
# All scoring weights, label thresholds, ladder parameters, and alert settings
# are defined here. This file is hot-reloaded on each scan run — changes take
# effect immediately without restarting the process.
#
# See docs/PRD.md §9 for full specification of each field.

scoring:
  baseline: 50
  component_weights:
    LONG:
      liquidity: 0.10
      trend_strength: 0.25
      volatility_compression: 0.10
      momentum: 0.25
      relative_strength: 0.20
      l2_support: 0.10
    SHORT:
      liquidity: 0.10
      trend_weakness: 0.25
      volatility_expansion: 0.10
      momentum: 0.25
      relative_weakness: 0.20
      l2_resistance: 0.10
  interaction_bonuses:
    confluence_bonus: 12.0
    breakout_bonus: 10.0
  counter_trend_penalty: 15.0

labeling:
  min_quote_volume: 1_000_000
  chase_change_pct: 15
  chase_pos_threshold: 0.80
  coiled_change_low: -3
  coiled_change_high: 5
  coiled_pos_low: 0.30
  coiled_pos_high: 0.65
  early_change_min: 2
  early_pos_max: 0.75
  entry_zone_score_min: 60

ladder:
  tranche_a_size_pct: 60
  tranche_b_size_pct: 40
  stop_pct: 3
  fib_a_low: 0.50
  fib_a_high: 0.618
  fib_b_level: 0.786
  target2_extension_pct: 5

alerts:
  dedupe_hours: 6
  quiet_hours_start: "00:00"
  quiet_hours_end: "07:59"
  timezone: "Africa/Nairobi"
  digest_time: "08:00"
