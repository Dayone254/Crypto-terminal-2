[project]
name = "tpt"
version = "0.1.0"
description = "Top Picker Terminal — local-first crypto market scanning tool"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "TPT Dev" }]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "apscheduler>=3.10.0",
    "typer[all]>=0.12.0",
    "pytz>=2024.1",
    "pandas>=2.2.0",
    "websockets>=12.0.0",
    "python-telegram-bot>=22.8",
]

[project.scripts]
tpt = "tpt.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-pytz",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/tpt"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    # B008: FastAPI's Depends()/Query() idiom is a function call in a default
    # argument by design, so this rule is a false positive for this codebase.
    "B008",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tpt --cov-report=term-missing"

[tool.coverage.run]
source = ["backend/tpt"]
omit = ["*/tests/*", "*/migrations/*"]
